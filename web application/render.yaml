services:
  # 1. Express Backend Web Service
  - type: web
    name: agro-ai-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Connect to MongoDB Atlas (e.g. mongodb+srv://...)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        value: http://agro-ai-vision:6000 
      - key: ALLOWED_ORIGINS
        value: "*" # Update this with your frontend URL once frontend is deployed

  # 2. Flask AI Service
  - type: web
    name: agro-ai-vision
    env: docker
    dockerContext: ai
    dockerfilePath: ai/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 6000

  # 3. React Frontend Service
  - type: web
    name: agro-ai-web
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agro-ai-backend.onrender.com/api # Replace with your actual backend URL
