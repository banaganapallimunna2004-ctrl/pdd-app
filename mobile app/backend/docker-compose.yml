version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/agro_db
      - JWT_SECRET=agro_ai_secret_key_2026
      - PORT=3000
    depends_on:
      - mongodb
    networks:
      - agro-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - agro-network

networks:
  agro-network:
    driver: bridge

volumes:
  mongo-data:
